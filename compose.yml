networks:
  go_intro:

volumes:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  prometheus_data:
  grafana_data:
  tempo_data:

services:

  zookeeper:
    container_name: zookeeper
    image: docker.io/confluentinc/cp-zookeeper:7.9.8
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - go_intro

  kafka:
    container_name: kafka
    image: docker.io/confluentinc/cp-kafka:7.9.8
    depends_on:
      - zookeeper
    hostname: kafka
    ports:
      - 9892:9892
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9892
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --list --bootstrap-server localhost:9092 && kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic ${KAFKA_TOPIC:-data} --replication-factor 1 --partitions 1 && kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic ${KAFKA_DLQ_TOPIC:-data.dlq} --replication-factor 1 --partitions 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - go_intro
  
  postgres:
    container_name: postgres
    image: docker.io/library/postgres:17.10-alpine
    ports:
      - 5432:5432
    volumes:
      # :z - SELinux relabel (no-op на не-SELinux системах и macOS),
      # нужен для rootless Podman на Fedora/RHEL, иначе доступ к bind-mount запрещён.
      - ./migrations:/docker-entrypoint-initdb.d:ro,z
      - ./data/postgres:/var/lib/postgresql/data:rw,z
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - go_intro

  worker:
    container_name: worker
    image: localhost/go-intro:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/worker"]
    # Внутри compose-сети адреса - по именам сервисов, а не localhost.
    # Kafka:9092 - внутренний listener (PLAINTEXT), 9892 только для доступа с хоста.
    environment:
      HEALTH_ADDR: ":8081"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-data}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-data.dlq}
      KAFKA_GROUP: ${KAFKA_GROUP:-go-intro-worker}
      POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-test}?sslmode=disable
      STORE_DRIVER: ${STORE_DRIVER:-pgx}
      EVENT_RETENTION: ${EVENT_RETENTION:-720h}
      EVENT_CLEANUP_INTERVAL: ${EVENT_CLEANUP_INTERVAL:-1h}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-5}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-50ms}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-1s}
    ports:
      - 8081:8081   # /healthz, /readyz
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - go_intro

  api:
    container_name: api
    # тот же образ и context, что и worker. Podman compose не гарантирует порядок
    # сборки shared-образа между сервисами, поэтому у api собственный build-блок;
    # второй build берётся из кэша слоёв - фактически бесплатно.
    image: localhost/go-intro:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/api"]
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-data}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-5}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-50ms}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-1s}
    ports:
      - 8080:8080
    depends_on:
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - go_intro

  tempo:
    container_name: tempo
    image: docker.io/grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro,z
      - tempo_data:/var/tempo
    ports:
      - 3200:3200
      - 4317:4317
      - 4318:4318
    networks:
      - go_intro

  prometheus:
    container_name: prometheus
    image: docker.io/prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
    networks:
      - go_intro

  grafana:
    container_name: grafana
    image: docker.io/grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    ports:
      - 3000:3000
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - go_intro